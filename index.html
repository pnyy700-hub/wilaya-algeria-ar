<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇩🇿 ولاية الجزائر AR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

#overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.top{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  padding:10px 18px;
  border-radius:30px;
  font-size:18px;
  white-space:nowrap;
}

.ar-card{
  position:absolute;
  top:42%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  background:rgba(0,0,0,.62);
  border:2px solid rgba(255,255,255,.8);
  border-radius:25px;
  padding:15px 25px;
  min-width:220px;
  box-shadow:0 0 25px rgba(255,255,255,.35);
}

.flag{
  font-size:45px;
}

#wilayaName{
  font-size:30px;
  font-weight:bold;
  margin-top:5px;
}

#mapText{
  font-size:16px;
  margin-top:8px;
}

.controls{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:450px;
  background:rgba(0,0,0,.78);
  padding:15px;
  border-radius:22px;
}

select,button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
}

button{
  background:#168a45;
  color:white;
}

#stop{
  background:#b52222;
}

#message{
  text-align:center;
  font-size:14px;
  margin-top:8px;
  color:#ddd;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<div id="overlay">

  <div class="top">
    🇩🇿 ولاية الجزائر AR
  </div>

  <div class="ar-card" id="arCard">
    <div class="flag">🇩🇿</div>
    <div id="wilayaName">الجزائر</div>
    <div id="mapText">خريطة الولاية 📍</div>
  </div>

</div>

<div class="controls">

<select id="wilaya">
  <option value="الجزائر">الجزائر</option>
  <option value="أدرار">أدرار</option>
  <option value="الشلف">الشلف</option>
  <option value="الأغواط">الأغواط</option>
  <option value="أم البواقي">أم البواقي</option>
  <option value="باتنة">باتنة</option>
  <option value="بجاية">بجاية</option>
  <option value="بسكرة">بسكرة</option>
  <option value="بشار">بشار</option>
  <option value="البليدة">البليدة</option>
  <option value="البويرة">البويرة</option>
  <option value="تمنراست">تمنراست</option>
  <option value="تبسة">تبسة</option>
  <option value="تلمسان">تلمسان</option>
  <option value="تيارت">تيارت</option>
  <option value="تيزي وزو">تيزي وزو</option>
  <option value="الجزائر">الجزائر</option>
  <option value="الجلفة">الجلفة</option>
  <option value="جيجل">جيجل</option>
  <option value="سطيف">سطيف</option>
  <option value="سعيدة">سعيدة</option>
  <option value="سكيكدة">سكيكدة</option>
  <option value="سيدي بلعباس">سيدي بلعباس</option>
  <option value="عنابة">عنابة</option>
  <option value="قالمة">قالمة</option>
  <option value="قسنطينة">قسنطينة</option>
  <option value="المدية">المدية</option>
  <option value="مستغانم">مستغانم</option>
  <option value="المسيلة">المسيلة</option>
  <option value="معسكر">معسكر</option>
  <option value="ورقلة">ورقلة</option>
  <option value="وهران">وهران</option>
  <option value="البيض">البيض</option>
  <option value="إليزي">إليزي</option>

  <option value="تيبازة">تيبازة</option>
  <option value="ميلة">ميلة</option>
  <option value="عين الدفلى">عين الدفلى</option>
  <option value="النعامة">النعامة</option>

  <option value="المغير">المغير</option>
  <option value="المنيعة">المنيعة</option>
</select>

<button onclick="startCamera()">📷 تشغيل الكاميرا</button>
<button id="stop" onclick="stopCamera()">⛔ إيقاف الكاميرا</button>

<div id="message">
اختر الولاية ثم شغّل الكاميرا
</div>

</div>

<script>

const video = document.getElementById("camera");
const wilaya = document.getElementById("wilaya");
const wilayaName = document.getElementById("wilayaName");
const message = document.getElementById("message");
const arCard = document.getElementById("arCard");

let stream = null;

wilaya.addEventListener("change", function(){
  wilayaName.textContent = this.value;
  message.textContent = "تم اختيار ولاية " + this.value;
});

async function startCamera(){

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"environment"
      },
      audio:false
    });

    video.srcObject = stream;

    message.textContent = "الكاميرا تعمل الآن 📷";

    if(
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ){

      try{
        await DeviceOrientationEvent.requestPermission();
      }catch(e){}

    }

  }catch(error){

    message.textContent =
      "لم يتم تشغيل الكاميرا. اسمح للموقع باستخدام الكاميرا.";

  }

}

function stopCamera(){

  if(stream){

    stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;

  }

  message.textContent = "تم إيقاف الكاميرا";
}

window.addEventListener("deviceorientation", function(event){

  let x = event.gamma || 0;
  let y = event.beta || 0;

  x = Math.max(-25, Math.min(25, x));
  y = Math.max(-20, Math.min(20, y));

  arCard.style.transform =
    "translate(calc(-50% + " + x*2 + "px), calc(-50% + " + y*0.5 + "px))";

});

</script>

</body>
</html>
